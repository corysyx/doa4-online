name: Netplay release
# Builds the main branch and publishes a pre-release alpha-v<x.y.z> (the version is DOA4_NETPLAY_VERSION in
# CMakeLists.txt, set by hand; a version whose release exists fails the Version step) that both online players
# download: the online handshake compares the compiled code, so players need the same exe.
# PUBLISH RULE (the user's decision): a push to main publishes a release only when the GAME changes, so the paths
# below are the game's inputs only (src, generated, third_party, the CMake files, hints, the manifest, the SDK pin).
# A change to the launcher, the tests, the tools, the README or this workflow publishes nothing, so players are not
# made to update for it. Such a change reaches players only by pushing a tag netplay-publish-<n> (after the user's
# yes), which publishes the same code again, provided DOA4_NETPLAY_VERSION was raised (the tag is alpha-v<x.y.z>).
on:
  push:
    branches: [main]
    paths: ['src/**', 'generated/**', 'third_party/**', 'CMakeLists.txt', 'CMakePresets.json', 'hints.toml',
            'dead_or_alive_4_manifest.toml', 'netplay_sdk.txt']
    tags: ['netplay-publish-*']
permissions:
  contents: write
concurrency:
  group: netplay-release
  cancel-in-progress: false
jobs:
  release:
    # forks of this fork publish nothing unless they opt in (repository variable PUBLISH_RELEASES = true)
    if: github.repository == 'Dwreckgg/doa4-online' || vars.PUBLISH_RELEASES == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with: { path: doa4-recomp, persist-credentials: false }   # the build never sees the write token
      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = Get-Content -Raw doa4-recomp/CMakeLists.txt
          $m = [regex]::Match($text, 'set\(DOA4_NETPLAY_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $m.Success) { throw 'DOA4_NETPLAY_VERSION (three numbers, x.y.z) not found in CMakeLists.txt' }
          $tag = "alpha-v$($m.Groups[1].Value)"
          # a release of this version exists: the version was not raised, and nothing is overwritten or duplicated
          $out = (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw "The release $tag already exists: raise DOA4_NETPLAY_VERSION in CMakeLists.txt before publishing again." }
          # only "release not found" means the version is new; any other gh failure (auth, network, rate limit) stops the step
          if ($out -notmatch 'release not found') { throw "gh release view $tag failed (exit $code), so it is not known whether the release exists: $out" }
          # the runner ends a pwsh step with 'exit $LASTEXITCODE': the expected exit 1 above must not become the step's result
          $global:LASTEXITCODE = 0
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "tag $tag"
      - name: SDK at the pinned commit
        shell: pwsh
        run: |
          $pin = Get-Content doa4-recomp/netplay_sdk.txt | ConvertFrom-StringData
          git clone --filter=blob:none $pin.repo rexglue-sdk
          git -C rexglue-sdk checkout $pin.commit
          if ($LASTEXITCODE -ne 0) { throw "SDK commit $($pin.commit) not found" }
          git -C rexglue-sdk submodule update --init --recursive
          python doa4-recomp/tools/fix_git_symlinks.py rexglue-sdk
      - name: LLVM 23.1.4
        shell: pwsh
        run: |
          # LLVM publishes Windows builds as an .msi and a .tar.xz (no .exe installer); the archive is unpacked into
          # C:\LLVM so it cannot clash with the image's own LLVM in Program Files.
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.xz'
          $want = '854BFFCFC84528E0EE92490FF5C178920ABD358A79C3E98F053E41E3E8E4C6D2'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest $url -OutFile llvm.tar.xz
          $got = (Get-FileHash llvm.tar.xz -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "LLVM archive SHA-256 $got, expected $want" }
          New-Item -ItemType Directory -Force C:\LLVM | Out-Null
          $t = Measure-Command { tar -xf llvm.tar.xz -C C:\LLVM --strip-components 1 }
          if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
          Write-Host "unpacked in $([int]$t.TotalSeconds) s"
          Remove-Item llvm.tar.xz
          & C:\LLVM\bin\clang.exe --version
          & C:\LLVM\bin\clang-cl.exe --version
          & C:\LLVM\bin\lld-link.exe --version
      - name: Page file
        shell: pwsh
        run: ./doa4-recomp/.github/scripts/SetPageFileSize.ps1 -MinimumSize 16GB -MaximumSize 32GB -DiskRoot "D:"
      - name: Configure, build, host tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          set "DOA4_VSDEVCMD=%VS%\Common7\Tools\VsDevCmd.bat"
          set "DOA4_LLVM_BIN=C:\LLVM\bin"
          call "%DOA4_VSDEVCMD%" -arch=amd64 -host_arch=amd64
          set "PATH=%DOA4_LLVM_BIN%;%PATH%"
          cd doa4-recomp
          cmake --preset win-amd64-release -DREXSDK_DIR=%GITHUB_WORKSPACE:\=/%/rexglue-sdk "-DCMAKE_C_FLAGS=-march=x86-64-v3" "-DCMAKE_CXX_FLAGS=-march=x86-64-v3" -DDOA4_RELEASE_TAG=${{ steps.version.outputs.tag }} -DDOA4_RELEASE_REPO=${{ github.repository }} -DDOA4_RELEASE_CHANNEL=alpha
          if errorlevel 1 exit /b 1
          cmake --build --preset win-amd64-release -- -j 2
          if errorlevel 1 exit /b 1
          set "REXSDK_DIR=%GITHUB_WORKSPACE%\rexglue-sdk"
          set "DOA4_CI=1"
          python -I tools/run_host_tests.py
          if errorlevel 1 exit /b 1
      - name: Release tool tests
        shell: cmd
        run: |
          set "DOA4_CI=1"
          cd doa4-recomp
          python -I tests/tools/test_release_tools.py
          if errorlevel 1 exit /b 1
      - name: Netplay tool tests
        shell: cmd
        run: |
          set "DOA4_CI=1"
          cd doa4-recomp
          python -I tests/tools/test_np_tools.py
          if errorlevel 1 exit /b 1
      - name: Stage
        shell: pwsh
        run: |
          $pin = Get-Content doa4-recomp/netplay_sdk.txt | ConvertFrom-StringData
          python -I doa4-recomp/tools/release_stage.py --build doa4-recomp/out/build/win-amd64-release --out staging `
            --tag ${{ steps.version.outputs.tag }} --port-commit $env:GITHUB_SHA --sdk-commit $pin.commit
          if ($LASTEXITCODE -ne 0) { throw 'staging refused' }
          Get-ChildItem staging | ForEach-Object { "$($_.Name)  $($_.Length) bytes" }
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pin = Get-Content doa4-recomp/netplay_sdk.txt | ConvertFrom-StringData
          # the version's CHANGELOG.md section goes above the fixed text; a version without a section is not published
          $m = [regex]::Match('${{ steps.version.outputs.tag }}', '^[a-z0-9]+-v([0-9]+\.[0-9]+\.[0-9]+)$')
          if (-not $m.Success) { throw 'the tag is not <channel>-v<x.y.z>' }
          $version = $m.Groups[1].Value
          python -I doa4-recomp/tools/changelog_section.py $version --changelog doa4-recomp/CHANGELOG.md --out changes.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no section for ${version}: add '## $version (<date>)' with the release's notes" }
          $changes = Get-Content -Raw -Encoding utf8 changes.md
          $notes = @"
          Dead or Alive 4 Online, built from commit $env:GITHUB_SHA (SDK $($pin.repo) $($pin.commit), LLVM 23.1.4).

          Download the zip (or use Check for Updates in the game's Online tab).
          "@
          $notes = "What's new in ${version}:`n`n$changes`n$notes"
          Set-Content notes.md $notes -Encoding utf8
          gh release create ${{ steps.version.outputs.tag }} (Get-ChildItem staging).FullName --repo $env:GITHUB_REPOSITORY `
            --prerelease --target $env:GITHUB_SHA --title "Dead or Alive 4 Online ${{ steps.version.outputs.tag }}" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
